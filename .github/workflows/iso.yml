# Builds the PolyOS live ISOs on GitHub's servers (Debian inside a privileged container):
# amd64 for Intel/AMD PCs and arm64 for ARM64 UEFI computers, each on a runner of its own kind.
#
# Releases are automatic: raise __version__ in polyos/__init__.py on main and this builds both ISOs
# and publishes them as release v<version>; the website's Download buttons offer the newest release
# right away. A version that is already released isn't built again.
#
# By hand: the Actions tab ("Run workflow") makes a test build with 14-day downloads on the run, or,
# with "Publish as a GitHub Release" ticked, publishes the current version. Pushing a tag like
# v0.7.0 also publishes a release.
#
# Settings for this repository (Settings > Secrets and variables > Actions):
#   secret POLYOS_UPDATE_KEY  Poly's release key; signs polyos-update.json so PolyOS installs the
#                             release as an online update (required: without it nothing is published)
#   variable RELEASES_REPO    e.g. kingxxasavan/polyos-releases: a public repository that holds the
#                             releases, so this one can be private (the website reads the same name)
#   secret RELEASES_TOKEN     a token that can create releases in RELEASES_REPO
name: Build PolyOS ISO

on:
  workflow_dispatch:
    inputs:
      dist:
        description: Debian release
        type: choice
        options: [trixie, bookworm]
        default: trixie
      release:
        description: Publish as a GitHub Release (the website's Download buttons offer it)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [polyos/__init__.py]  # the version number lives here
    tags: ["v*"]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # publishing releases

env:
  DIST: ${{ inputs.dist || 'trixie' }}
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.kind.outputs.build }}
      publish: ${{ steps.kind.outputs.publish }}
      tag: ${{ steps.kind.outputs.tag }}
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Checks and tests
        run: python3 main.py check && python3 main.py test

      - name: Release or test build?
        id: kind
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          version="v$(python3 -c 'import polyos; print(polyos.__version__)')"
          channel="$(python3 -c 'import polyos; print(polyos.__channel__)')"
          editions="$(python3 -c 'import polyos; print(",".join(polyos.__editions__))')"
          prerelease=false
          [ "$channel" = "stable" ] || prerelease=true
          # an edition release (e.g. Developer only) is a pre-release: the Download buttons and PolyOS
          # before 1.2.2 skip it; newer PolyOS gets it only on computers of that edition
          [ -z "$editions" ] || prerelease=true
          build=true publish=false tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # polyos/__init__.py changed on main: a new version is released, the same one isn't rebuilt
            if git ls-remote --exit-code --tags "https://github.com/$RELEASES_REPO.git" "refs/tags/$version" > /dev/null; then
              echo "::notice::$version is already released; nothing to build."
              build=false
            else
              found=$?
              [ "$found" -eq 2 ] || exit "$found"  # 2: no such tag; anything else is a real error
              publish=true tag="$version"
            fi
          elif [ "$RELEASE_INPUT" = "true" ]; then
            publish=true tag="$version"
          fi
          { echo "build=$build"; echo "publish=$publish"; echo "tag=$tag"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          echo "version $version ($channel): build=$build publish=$publish tag=$tag, releases in $RELEASES_REPO"

  iso:
    needs: setup
    if: ${{ needs.setup.outputs.build == 'true' }}
    strategy:
      fail-fast: false  # one architecture failing still publishes the other
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            grub: grub-efi-amd64-bin grub-pc-bin
          - arch: arm64
            runner: ubuntu-24.04-arm
            grub: grub-efi-arm64-bin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ${{ matrix.arch }} ISO in Debian ${{ env.DIST }}
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src "debian:$DIST" bash -euxc "
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap python3 ca-certificates \
              xorriso squashfs-tools ${{ matrix.grub }} mtools dosfstools
            python3 main.py iso --dist $DIST --arch ${{ matrix.arch }} --workdir /tmp/polyos-iso
          "
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -lh dist/

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: polyos-${{ env.DIST }}-${{ matrix.arch }}-iso
          path: dist/*.iso
          compression-level: 0
          retention-days: ${{ needs.setup.outputs.publish == 'true' && 1 || 14 }}

  release:
    needs: [setup, iso]
    if: ${{ !cancelled() && needs.setup.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the ISOs
        uses: actions/download-artifact@v4
        with:
          pattern: polyos-*-iso
          merge-multiple: true
          path: dist

      # Online updates: PolyOS's own packages and polyos-update.json (their checksums), which
      # Settings > About on installed computers reads to update without a new ISO.
      - name: PolyOS packages for online updates (signed with Poly's release key)
        env:
          POLYOS_UPDATE_KEY: ${{ secrets.POLYOS_UPDATE_KEY }}
        run: |
          # PolyOS 1.0 and later install only signed updates, so an unsigned release would strand
          # every installed computer: stop here instead of publishing one.
          if [ -z "$POLYOS_UPDATE_KEY" ]; then
            echo "::error::The POLYOS_UPDATE_KEY secret isn't set (Settings > Secrets and variables > Actions), so this release can't be signed and installed computers wouldn't install it. Add the secret, then use Re-run failed jobs on this run."
            exit 1
          fi
          python3 main.py deb --out dist --manifest
          test -s dist/polyos-update.json.sig

      - name: Checksums (and parts, if an ISO is over GitHub's 2 GiB per-file limit)
        run: |
          cd dist
          ls *.iso >/dev/null  # stop if no ISO was built at all
          # fixed names, so the website's /download/pc and /download/arm64 always get the newest release
          for arch in amd64 arm64; do
            for f in polyos-*-"$arch".iso; do if [ -e "$f" ]; then mv "$f" "polyos-$arch.iso"; fi; done
          done
          # The dual-boot installer: the same ISO with dual boot switched on in /polyos/install.json
          # (on the USB drive, outside the system image, so no second build). The website offers only
          # polyos-<arch>.iso, which installs PolyOS on a whole drive (a fresh install).
          if [ -e polyos-amd64.iso ]; then
            sudo apt-get install -y -q xorriso > /dev/null
            printf '{"dualBoot": true}\n' > dual.json
            xorriso -indev polyos-amd64.iso -outdev polyos-amd64-dualboot.iso -boot_image any replay \
              -map dual.json /polyos/install.json
            rm dual.json
          fi
          sha256sum ./*.iso | sed 's#\./##' > SHA256SUMS
          for iso in *.iso; do
            # GitHub takes files under 2 GiB (2147483648 bytes) and serves them as a plain download,
            # so only a bigger ISO is split (the website then sends people to SourceForge's whole copy)
            if [ "$(stat -c %s "$iso")" -ge 2147483648 ]; then
              split -b 1900M -d -a 1 "$iso" "$iso.part"
              sha256sum "$iso".part* >> SHA256SUMS
              rm "$iso"
              echo "PARTS=yes" >> "$GITHUB_ENV"
            fi
          done
          ls -lh

      # The body: RELEASE_NOTES.md first (PolyOS and the website show only that part), then the files.
      - name: Release notes
        env:
          SF_PROJECT: ${{ vars.SF_PROJECT }}
        run: |
          {
            editions="$(python3 -c 'import polyos; print(" and ".join(e.title() for e in polyos.__editions__))')"
            if [ -n "$editions" ]; then echo "**An update for the $editions edition only.** Other computers stay on the newest update for everyone."; echo; fi
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; echo; fi
            echo '<!-- files -->'
            echo
            echo '**PolyOS 7 for Debian ${{ needs.setup.outputs.tag }}** (Debian ${{ env.DIST }})'
            echo
            echo '| File | For |'
            echo '|---|---|'
            echo '| `polyos-amd64.iso` | Intel and AMD PCs and laptops (almost every Windows PC). Installs PolyOS on a whole drive (a fresh install) |'
            echo '| `polyos-arm64.iso` | ARM64: Apple Silicon Macs in UTM, Parallels or VMware Fusion, ARM cloud servers, and ARM64 computers with UEFI firmware (from a USB drive) |'
            echo
            if [ -n "${PARTS:-}" ] && [ -n "${SF_PROJECT:-}" ]; then
              echo "1. Download the \`.iso\` for your computer, as one file, from [SourceForge](https://sourceforge.net/projects/$SF_PROJECT/files/${{ needs.setup.outputs.tag }}/) (or from the website's Download page)."
            elif [ -n "${PARTS:-}" ]; then
              echo '1. Download the `.iso` for your computer (in parts: join them with `cat polyos-*.part* > polyos.iso` on Linux/macOS, or `copy /b part0+part1 polyos.iso` on Windows).'
            else
              echo '1. Download the `.iso` for your computer.'
            fi
            echo '2. Write it to a USB drive (8 GB or more) with balenaEtcher, or Rufus in DD mode, or start it in a virtual machine.'
            echo '3. Start the computer from it, try PolyOS, and choose **Install PolyOS 7**.'
            echo
            echo "**Already on PolyOS?** Settings › Updates installs this version without a new USB drive (it's signed with Poly's release key)."
            echo
            echo 'Check the download against `SHA256SUMS`.'
          } > dist/RELEASE_BODY.md
          cat dist/RELEASE_BODY.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.setup.outputs.tag }}
          # a separate releases repository has none of this repository's commits: tag its own default branch
          target_commitish: ${{ env.RELEASES_REPO == github.repository && github.sha || '' }}
          name: PolyOS ${{ needs.setup.outputs.tag }}
          files: |
            dist/*.iso
            dist/*.iso.part*
            dist/SHA256SUMS
            dist/*.deb
            dist/polyos-update.json
            dist/polyos-update.json.sig
          body_path: dist/RELEASE_BODY.md
          generate_release_notes: ${{ env.RELEASES_REPO == github.repository }}

  # The whole ISOs on SourceForge too (no 2 GB limit there); does nothing until SourceForge is set up
  sourceforge:
    needs: [setup, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/sourceforge.yml
    with:
      tag: ${{ needs.setup.outputs.tag }}
    secrets:
      SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
