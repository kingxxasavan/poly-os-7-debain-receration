# PolyOS: start PolyOS right away, without waiting on a menu. With Windows on the computer too,
# the installer shows the PolyOS boot menu with a countdown instead (GRUB_TIMEOUT_STYLE=menu in
# /etc/default/grub; Settings › Power & Performance switches it). While it's hidden, hold Shift
# or press Esc while the computer starts to see it, or use Start › Power › Restart to Windows.
# grub-reboot needs GRUB_DEFAULT=saved.
GRUB_DEFAULT=saved
if [ "${GRUB_TIMEOUT_STYLE:-}" != menu ]; then
    GRUB_TIMEOUT_STYLE=hidden
    GRUB_TIMEOUT=2
fi
