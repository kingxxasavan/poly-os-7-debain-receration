# PolyOS: start PolyOS right away, without waiting on a menu. With Windows on the computer too,
# hold Shift or press Esc while it starts to see the boot menu, or use Start › Power ›
# Restart to Windows (grub-reboot, which needs GRUB_DEFAULT=saved).
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
GRUB_DEFAULT=saved
