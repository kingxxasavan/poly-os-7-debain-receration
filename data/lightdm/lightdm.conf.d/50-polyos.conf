# Installed by polyos-desktop: PolyOS is the default session and the PolyOS login screen is
# the greeter (it falls back to lightdm-gtk-greeter on its own if it can't start).
[Seat:*]
user-session=polyos
greeter-session=polyos-greeter
# Show the accounts on the login screen (Debian hides them by default).
greeter-hide-users=false
# Sign in with your PIN or password (/etc/pam.d/polyos-login, from polyos-shell).
pam-service=polyos-login
